<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>VOCÊ EM AÇÃO</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
			rel="stylesheet"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--accent: #ccffb5;
				--accent-dim: rgba(232, 255, 0, 0.12);
				--bg: #080808;
				--surface: #111111;
				--surface2: #181818;
				--border: rgba(255, 255, 255, 0.07);
				--text: #f0f0f0;
				--muted: #666;
				--font-display: "Bebas Neue", sans-serif;
				--font-body: "DM Sans", sans-serif;
			}

			html {
				scroll-behavior: smooth;
			}

			body {
				font-family: var(--font-body);
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				overflow-x: hidden;
			}

			/* ─── NOISE OVERLAY ─── */
			body::before {
				content: "";
				position: fixed;
				inset: 0;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
				pointer-events: none;
				z-index: 9999;
				opacity: 0.5;
			}

			/* ─── HEADER ─── */
			header {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				z-index: 100;
				padding: 0 2rem;
				height: 68px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				background: rgba(8, 8, 8, 0.85);
				backdrop-filter: blur(20px);
				border-bottom: 1px solid var(--border);
			}

			.logo {
				font-family: var(--font-display);
				font-size: 1.5rem;
				letter-spacing: 0.08em;
				color: var(--text);
				line-height: 1;
				display: flex;
				align-items: center;
				gap: 10px;
				text-decoration: none;
			}

			.logo-dot {
				width: 8px;
				height: 8px;
				background: var(--accent);
				border-radius: 50%;
				flex-shrink: 0;
				animation: pulse 2s ease-in-out infinite;
			}

			@keyframes pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 1;
				}
				50% {
					transform: scale(1.4);
					opacity: 0.7;
				}
			}

			.search-wrap {
				position: relative;
				width: 260px;
			}

			.search-wrap svg {
				position: absolute;
				left: 14px;
				top: 50%;
				transform: translateY(-50%);
				width: 14px;
				height: 14px;
				stroke: var(--muted);
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				pointer-events: none;
				transition: stroke 0.2s;
			}

			#search-input {
				width: 100%;
				padding: 0.6rem 1rem 0.6rem 2.4rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 6px;
				color: var(--text);
				font-family: var(--font-body);
				font-size: 0.85rem;
				font-weight: 300;
				letter-spacing: 0.02em;
				transition:
					border-color 0.25s,
					background 0.25s;
				outline: none;
			}

			#search-input::placeholder {
				color: var(--muted);
			}

			#search-input:focus {
				border-color: var(--accent);
				background: var(--surface2);
			}

			#search-input:focus + svg {
				stroke: var(--accent);
			}

			/* ─── HERO STRIP ─── */
			.hero-strip {
				margin-top: 68px;
				padding: 4rem 2rem 2.5rem;
				display: flex;
				align-items: flex-end;
				justify-content: space-between;
				gap: 1rem;
				border-bottom: 1px solid var(--border);
				position: relative;
				overflow: hidden;
			}

			.hero-strip::after {
				content: "RUN";
				position: absolute;
				right: -10px;
				top: -20px;
				font-family: var(--font-display);
				font-size: clamp(8rem, 20vw, 16rem);
				color: rgba(255, 255, 255, 0.02);
				line-height: 1;
				pointer-events: none;
				user-select: none;
				letter-spacing: -0.02em;
			}

			.hero-title {
				font-family: var(--font-display);
				font-size: clamp(2.8rem, 6vw, 5rem);
				letter-spacing: 0.04em;
				line-height: 0.95;
				color: var(--text);
			}

			.hero-title span {
				color: var(--accent);
			}

			.hero-meta {
				display: flex;
				align-items: center;
				gap: 1.5rem;
				flex-shrink: 0;
			}

			.stat-pill {
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 2px;
			}

			.stat-pill .num {
				font-family: var(--font-display);
				font-size: 2rem;
				line-height: 1;
				color: var(--accent);
				letter-spacing: 0.02em;
			}

			.stat-pill .label {
				font-size: 0.7rem;
				font-weight: 300;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}

			.stat-divider {
				width: 1px;
				height: 40px;
				background: var(--border);
			}

			/* ─── TABS / FILTER BAR ─── */
			.tab-bar {
				display: flex;
				align-items: center;
				gap: 0;
				padding: 0 2rem;
				border-bottom: 1px solid var(--border);
				overflow-x: auto;
				scrollbar-width: none;
			}

			.tab-bar::-webkit-scrollbar {
				display: none;
			}

			.tab-btn {
				background: none;
				border: none;
				border-bottom: 2px solid transparent;
				padding: 1rem 1.4rem;
				cursor: pointer;
				font-family: var(--font-body);
				font-size: 0.8rem;
				font-weight: 500;
				color: var(--muted);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				transition:
					color 0.2s,
					border-color 0.2s;
				white-space: nowrap;
				flex-shrink: 0;
				margin-bottom: -1px;
			}

			.tab-btn:hover {
				color: var(--text);
			}

			.tab-btn.active {
				color: var(--accent);
				border-bottom-color: var(--accent);
			}

			.tab-count {
				display: inline-block;
				font-size: 0.65rem;
				background: var(--accent-dim);
				color: var(--accent);
				border-radius: 3px;
				padding: 1px 5px;
				margin-left: 6px;
				font-weight: 500;
				letter-spacing: 0;
			}

			/* ─── MAIN CONTENT ─── */
			.main {
				padding: 0 2rem 5rem;
				max-width: 1400px;
				margin: 0 auto;
			}

			/* ─── COLUMN LAYOUT ─── */
			.columns-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 1px;
				background: var(--border);
			}

			.col-wrap {
				background: var(--bg);
				padding: 2.5rem 1.8rem;
			}

			.col-header {
				display: none;
			}

			.col-name {
				font-family: var(--font-display);
				font-size: 1.4rem;
				letter-spacing: 0.06em;
				color: var(--text);
			}

			/* ─── CARDS ─── */
			.events-list {
				display: flex;
				flex-direction: column;
				gap: 0;
			}

			.event-card {
				display: block;
				text-decoration: none;
				background: var(--bg);
				overflow: hidden;
				transition: background 0.2s;
				position: relative;
			}

			.event-card:hover {
				background: var(--surface);
			}

			.event-card:hover .card-img-wrap img {
				transform: scale(1.04);
			}

			.event-card:hover .card-arrow {
				opacity: 1;
				transform: translate(0, 0);
			}

			.card-img-wrap {
				overflow: hidden;
				aspect-ratio: 16/9;
				background: var(--surface2);
			}

			.card-img-wrap img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
				transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
				filter: saturate(0.9);
			}

			.card-body {
				padding: 1rem 1.2rem;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}

			.card-title {
				font-weight: 500;
				font-size: 0.92rem;
				color: var(--text);
				line-height: 1.3;
			}

			.card-footer {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-top: 0.3rem;
			}

			.card-meta {
				font-size: 0.75rem;
				font-weight: 300;
				color: var(--muted);
				display: flex;
				gap: 12px;
			}

			.card-arrow {
				width: 24px;
				height: 24px;
				border-radius: 50%;
				border: 1px solid var(--border);
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				transform: translate(-4px, 4px);
				transition:
					opacity 0.25s,
					transform 0.25s;
				flex-shrink: 0;
			}

			.card-arrow svg {
				width: 10px;
				height: 10px;
				stroke: var(--accent);
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			/* ─── MOBILE ALL-IN-ONE ─── */
			.mobile-view {
				display: none;
			}

			.mobile-list {
				display: flex;
				flex-direction: column;
				gap: 0;
				margin-top: 2rem;
			}

			.mobile-card {
				display: grid;
				grid-template-columns: 110px 1fr;
				background: var(--bg);
				text-decoration: none;
				overflow: hidden;
				transition: background 0.2s;
			}

			.mobile-card:hover {
				background: var(--surface);
			}

			.mobile-card-img {
				width: 110px;
				height: 80px;
				object-fit: cover;
				display: block;
			}

			.mobile-card-body {
				padding: 0.7rem 1rem;
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: 4px;
			}

			.mobile-card-title {
				font-size: 0.82rem;
				font-weight: 500;
				color: var(--text);
				line-height: 1.25;
			}

			.mobile-card-date {
				font-size: 0.7rem;
				font-weight: 300;
				color: var(--muted);
			}

			/* ─── EMPTY STATE ─── */
			.empty-state {
				padding: 3rem 0;
				text-align: center;
				color: var(--muted);
				font-size: 0.85rem;
				font-weight: 300;
				letter-spacing: 0.05em;
			}

			.empty-state::before {
				content: "—";
				display: block;
				font-family: var(--font-display);
				font-size: 2rem;
				color: var(--border);
				margin-bottom: 1rem;
			}

			/* ─── WHATSAPP ─── */
			.wa-btn {
				position: fixed;
				bottom: 28px;
				right: 28px;
				width: 52px;
				height: 52px;
				background: #25d366;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 200;
				text-decoration: none;
				transition:
					transform 0.25s,
					box-shadow 0.25s;
				box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
			}

			.wa-btn:hover {
				transform: scale(1.1);
				box-shadow: 0 6px 28px rgba(37, 211, 102, 0.45);
			}

			.wa-btn svg {
				width: 26px;
				height: 26px;
				fill: #fff;
			}

			/* ─── RESPONSIVE ─── */
			@media (max-width: 900px) {
				.desktop-view {
					display: none;
				}
				.mobile-view {
					display: block;
				}
				header {
					padding: 0 1.2rem;
				}
				.search-wrap {
					width: 180px;
				}
				.hero-strip {
					padding: 3rem 1.2rem 2rem;
					flex-direction: column;
					align-items: flex-start;
				}
				.hero-strip::after {
					display: none;
				}
				.hero-meta {
					flex-direction: row;
				}
				.tab-bar {
					padding: 0 1.2rem;
				}
				.main {
					padding: 0 1.2rem 4rem;
				}
			}

			@media (max-width: 480px) {
				.logo {
					font-size: 1.15rem;
				}
				.search-wrap {
					width: 140px;
				}
				.hero-title {
					font-size: 2.2rem;
				}
				.stat-pill .num {
					font-size: 1.5rem;
				}
			}

			/* ─── SCROLL FADE-IN ─── */
			.fade-in {
				opacity: 0;
				transform: translateY(16px);
				transition:
					opacity 0.5s ease,
					transform 0.5s ease;
			}

			.fade-in.visible {
				opacity: 1;
				transform: translateY(0);
			}
		</style>
	</head>
	<body>
		<header>
			<a href="#" class="logo">
				<span class="logo-dot"></span>
				VOCÊ EM<span style="color: var(--accent)">AÇÃO</span>
			</a>
			<div class="search-wrap">
				<input type="text" id="search-input" placeholder="Buscar prova..." />
				<svg viewBox="0 0 24 24">
					<circle cx="11" cy="11" r="8" />
					<line x1="21" y1="21" x2="16.65" y2="16.65" />
				</svg>
			</div>
		</header>

		<div class="hero-strip">
			<div>
				<h1 class="hero-title">
					FOTOGRAFIA<br /><span>ESPORTIVA</span><br />DE CORRIDA
				</h1>
			</div>
			<div class="hero-meta">
				<div class="stat-pill">
					<span class="num" id="stat-total">0</span>
					<span class="label">Eventos</span>
				</div>
				<div class="stat-divider"></div>
				<div class="stat-pill">
					<span class="num">3</span>
					<span class="label">Portais</span>
				</div>
			</div>
		</div>

		<div class="tab-bar" id="tab-bar">
			<button class="tab-btn active" data-tab="all">
				Todos <span class="tab-count" id="tc-all">0</span>
			</button>
		</div>

		<div class="main">
			<!-- DESKTOP 3-col -->
			<div class="desktop-view">
				<div class="columns-grid" id="cols-grid">
					<div class="col-wrap" id="list-col-1"></div>
					<div class="col-wrap" id="list-col-2"></div>
					<div class="col-wrap" id="list-col-3"></div>
				</div>
			</div>

			<!-- MOBILE single feed -->
			<div class="mobile-view">
				<div class="mobile-list" id="list-mobile"></div>
			</div>
		</div>

		<!-- WhatsApp -->
		<a
			href="https://wa.me/5516988308280"
			class="wa-btn"
			target="_blank"
			aria-label="WhatsApp"
		>
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<path
					d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
				/>
			</svg>
		</a>

		<script>
			let allEvents = { fotop: [], foco_radical: [], fotto: [] };
			let searchTerm = "";

			function parseDate(str) {
				if (!str) return 0;
				const part = str.split("-")[0].trim();

				// Format: "DD/MM/YYYY" (fotop, fotto)
				if (part.includes("/")) {
					const [d, m, y] = part.split("/");
					return new Date(+y, +m - 1, +d).getTime();
				}

				// Format: "DD Mon YYYY" (foco_radical)
				const months = {
					Jan: 0,
					Feb: 1,
					Mar: 2,
					Apr: 3,
					May: 4,
					Jun: 5,
					Jul: 6,
					Aug: 7,
					Sep: 8,
					Oct: 9,
					Nov: 10,
					Dec: 11,
				};
				const parts = part.split(" ");
				if (parts.length === 3) {
					const d = +parts[0];
					const m = months[parts[1]];
					const y = +parts[2];
					if (m !== undefined) return new Date(y, m, d).getTime();
				}

				return 0;
			}

			function cardHTML(ev) {
				return `
      <a href="${ev.link}" class="event-card fade-in" target="_blank">
        <div class="card-img-wrap">
          <img src="${ev.imagem}" loading="lazy"
               onerror="this.src='https://placehold.co/640x360/111111/333333?text=FOTO+EM+BREVE'"/>
        </div>
        <div class="card-body">
          <div class="card-title">${ev.titulo}</div>
          <div class="card-footer">
            <div class="card-meta">
              <span>${ev.data}</span>
              <span>${ev.local}</span>
            </div>
            <div class="card-arrow">
              <svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </div>
          </div>
        </div>
      </a>`;
			}

			function mobileCardHTML(ev) {
				return `
      <a href="${ev.link}" class="mobile-card fade-in" target="_blank">
        <img class="mobile-card-img" src="${ev.imagem}" loading="lazy"
             onerror="this.src='https://placehold.co/110x80/111111/333333?text=...'"/>
        <div class="mobile-card-body">
          <div class="mobile-card-title">${ev.titulo}</div>
          <div class="mobile-card-date">${ev.data} · ${ev.local}</div>
        </div>
      </a>`;
			}

			function emptyHTML() {
				return `<div class="empty-state">Nenhum evento encontrado</div>`;
			}

			function renderAll() {
				const term = searchTerm;

				// Merge all events from all sources
				let merged = [
					...allEvents.fotop,
					...allEvents.foco_radical,
					...allEvents.fotto,
				];

				// Filter by search term
				merged = merged.filter(
					(e) =>
						e.titulo.toLowerCase().includes(term.toLowerCase()) ||
						e.local.toLowerCase().includes(term.toLowerCase()),
				);

				// Sort by date (most recent first)
				merged.sort((a, b) => parseDate(b.data) - parseDate(a.data));

				// Count
				const total = merged.length;
				document.getElementById("stat-total").textContent = total;
				document.getElementById("tc-all").textContent = total;

				// Distribute events across 3 columns
				const col1 = [];
				const col2 = [];
				const col3 = [];
				merged.forEach((e, i) => {
					if (i % 3 === 0) col1.push(e);
					else if (i % 3 === 1) col2.push(e);
					else col3.push(e);
				});

				// Render desktop columns
				const renderCol = (list, id) => {
					const el = document.getElementById(id);
					const events = document.createElement("div");
					events.className = "events-list";
					events.innerHTML = list.length
						? list.map((e) => cardHTML(e)).join("")
						: emptyHTML();
					el.innerHTML = "";
					el.appendChild(events);
				};
				renderCol(col1, "list-col-1");
				renderCol(col2, "list-col-2");
				renderCol(col3, "list-col-3");

				// Render mobile (all events sorted by date)
				const mob = document.getElementById("list-mobile");
				const mobileList = document.createElement("div");
				mobileList.className = "mobile-list";
				mobileList.innerHTML = merged.length
					? merged.map((e) => mobileCardHTML(e)).join("")
					: emptyHTML();
				mob.innerHTML = "";
				mob.appendChild(mobileList);

				// Fade-in observer
				requestAnimationFrame(() => {
					document.querySelectorAll(".fade-in").forEach((el) => {
						if (!el.classList.contains("visible")) {
							observer.observe(el);
						}
					});
				});
			}

			const observer = new IntersectionObserver(
				(entries) => {
					entries.forEach((e) => {
						if (e.isIntersecting) {
							e.target.classList.add("visible");
							observer.unobserve(e.target);
						}
					});
				},
				{ threshold: 0.05 },
			);

			// Tabs
			document.querySelectorAll(".tab-btn").forEach((btn) => {
				btn.addEventListener("click", () => {
					// Removed tab filtering logic - always show all events
				});
			});

			// Search
			document.getElementById("search-input").addEventListener("input", (e) => {
				searchTerm = e.target.value.trim();
				renderAll();
			});

			async function loadEvents() {
				try {
					const r = await fetch("eventos.json?v=" + Date.now());
					allEvents = await r.json();
				} catch {
					allEvents = { fotop: [], foco_radical: [], fotto: [] };
				}
				renderAll();
			}

			loadEvents();
		</script>
	</body>
</html>
