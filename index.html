<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Portal da Fotografia Esportiva</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				font-family: "Inter", sans-serif;
				background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
				min-height: 100vh;
			}
			.hero-section {
				background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem 0;
				position: relative;
			}
			.hero-title {
				font-weight: 800;
				font-size: 4rem;
				color: #e94560;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
				margin-bottom: 2rem;
			}
			.hero-content {
				text-align: center;
				max-width: 800px;
				width: 100%;
			}
			.search-container {
				position: relative;
				max-width: 600px;
				margin: 0 auto;
			}
			.search-input {
				width: 100%;
				padding: 1.5rem 2rem;
				font-size: 1.5rem;
				border: 3px solid rgba(255, 255, 255, 0.2);
				border-radius: 50px;
				background: rgba(255, 255, 255, 0.1);
				color: white;
				outline: none;
				transition: all 0.3s ease;
			}
			.search-input::placeholder {
				color: rgba(255, 255, 255, 0.7);
			}
			.search-input:focus {
				border-color: #e94560;
				background: rgba(255, 255, 255, 0.15);
				box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
			}
			.search-icon {
				position: absolute;
				right: 2rem;
				top: 50%;
				transform: translateY(-50%);
				color: rgba(255, 255, 255, 0.7);
				font-size: 1.5rem;
			}
			.scroll-indicator {
				position: absolute;
				bottom: 2rem;
				left: 50%;
				transform: translateX(-50%);
				color: rgba(255, 255, 255, 0.6);
				font-size: 1rem;
				animation: bounce 2s infinite;
			}
			@keyframes bounce {
				0%,
				20%,
				50%,
				80%,
				100% {
					transform: translateX(-50%) translateY(0);
				}
				40% {
					transform: translateX(-50%) translateY(-10px);
				}
				60% {
					transform: translateX(-50%) translateY(-5px);
				}
			}
			.content-section {
				padding: 3rem 0;
			}
			.event-card {
				background: rgba(255, 255, 255, 0.05);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 1rem;
				overflow: hidden;
				transition: all 0.3s ease;
				text-decoration: none;
				color: inherit;
				height: 100%;
				opacity: 1;
				transform: scale(1);
			}
			.event-card.hidden {
				opacity: 0;
				transform: scale(0.8);
				pointer-events: none;
			}
			.event-card:hover {
				transform: translateY(-5px) scale(1.02);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
				border-color: #e94560;
			}
			.event-img {
				width: 100%;
				height: 200px;
				object-fit: cover;
			}
			.event-content {
				padding: 1.5rem;
			}
			.event-name {
				font-weight: 600;
				font-size: 1.1rem;
				margin-bottom: 0.5rem;
				color: #ffffff;
			}
			.event-meta {
				font-size: 0.9rem;
				color: #b0b0b0;
			}
			.column-title {
				font-weight: 800;
				font-size: 1.5rem;
				color: #e94560;
				margin-bottom: 2rem;
				text-align: center;
			}
			.badge-count {
				background: #e94560;
				color: white;
				border-radius: 50%;
				padding: 0.2rem 0.6rem;
				font-size: 0.8rem;
			}
		</style>
	</head>
	<body>
		<div class="hero-section">
			<div class="container">
				<div class="hero-content">
					<h1 class="hero-title">📸 Portal da Fotografia Esportiva</h1>
					<div class="search-container">
						<input
							type="text"
							id="search-input"
							class="search-input"
							placeholder="Buscar eventos por nome..."
						/>
						<i class="search-icon">🔍</i>
					</div>
					<div class="scroll-indicator">Role para baixo para ver os eventos</div>
				</div>
			</div>
		</div>

		<div class="content-section">
			<div class="container">
				<div class="row g-4">
					<div class="col-lg-4 col-md-6">
						<div class="column-title">
							Fotop <span class="badge-count" id="count-fotop">0</span>
						</div>
						<div id="list-fotop" class="row g-3"></div>
					</div>

					<div class="col-lg-4 col-md-6">
						<div class="column-title">
							Foco Radical <span class="badge-count" id="count-foco">0</span>
						</div>
						<div id="list-foco" class="row g-3"></div>
					</div>

					<div class="col-lg-4 col-md-12">
						<div class="column-title">
							Fotto <span class="badge-count" id="count-fotto">0</span>
						</div>
						<div id="list-fotto" class="row g-3"></div>
					</div>
				</div>
			</div>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
		<script>
			let allEvents = { fotop: [], foco_radical: [], fotto: [] };

			async function loadEvents() {
				try {
					const response = await fetch("eventos.json?v=" + Date.now());
					const data = await response.json();

					allEvents = data;
					renderAllLists();
				} catch (err) {
					console.error("Erro ao carregar eventos:", err);
				}
			}

			function renderAllLists(searchTerm = "") {
				renderList(allEvents.fotop, "list-fotop", "count-fotop", searchTerm);
				renderList(allEvents.foco_radical, "list-foco", "count-foco", searchTerm);
				renderList(allEvents.fotto, "list-fotto", "count-fotto", searchTerm);
			}

			function renderList(list, containerId, countId, searchTerm = "") {
				const container = document.getElementById(containerId);
				const countElement = document.getElementById(countId);

				let filteredItems = list || [];
				if (searchTerm) {
					filteredItems = filteredItems.filter((event) =>
						event.titulo.toLowerCase().includes(searchTerm.toLowerCase()),
					);
				}

				countElement.innerText = filteredItems.length;

				if (filteredItems.length === 0) {
					container.innerHTML = searchTerm
						? '<div class="col-12"><div class="alert alert-warning" role="alert">Nenhum evento encontrado para esta busca.</div></div>'
						: '<div class="col-12"><div class="alert alert-secondary" role="alert">Nenhum evento recente.</div></div>';
					return;
				}

				container.innerHTML = filteredItems
					.map(
						(ev) => `
						<div class="col-12">
							<a href="${ev.link}" class="event-card card h-100" target="_blank">
								<img src="${ev.imagem}" class="event-img card-img-top" onerror="this.src='https://placehold.co/400x225/333/666?text=Sem+Foto'">
								<div class="event-content card-body">
									<h5 class="event-name card-title">${ev.titulo}</h5>
									<p class="event-meta card-text">
										📅 ${ev.data} • 📍 ${ev.local}
									</p>
								</div>
							</a>
						</div>
					`,
					)
					.join("");
			}

			// Função de pesquisa
			function handleSearch() {
				const searchTerm = document.getElementById("search-input").value.trim();
				renderAllLists(searchTerm);
			}

			// Event listeners
			document
				.getElementById("search-input")
				.addEventListener("keypress", function (e) {
					if (e.key === "Enter") {
						handleSearch();
					}
				});

			loadEvents();
		</script>
	</body>
</html>
